[pytest]
markers =
    backend: pure-Python backend / unit / pytest-bdd tests; no external services; runs by default.
    manual: human-run acceptance scenarios (Sprint 3 S2-8a paradigm-comparison artefact); not executed by automated pytest; default-excluded.
    source-code-regression-guard: static-source assertions against repo files (e.g. the P2-3 chat.html blur-text guard); runs by default.
addopts = -m "not manual"
